<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>called-it</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f6f7f9;
      color: #1c1f26;
    }
    main { padding: 24px; text-align: center; }
    h1 { font-size: 2rem; margin: 0 0 8px; }
    p { margin: 0 0 20px; color: #596070; }
    button {
      font: inherit;
      padding: 12px 20px;
      border: 0;
      border-radius: 10px;
      background: #3b5bdb;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>New Prototype</h1>
    <p>Edit <code>index.html</code> to start building.</p>
    <button id="btn">Tap me</button>
    <p id="out"></p>
  </main>
  <script>
    let taps = 0;
    document.getElementById("btn").addEventListener("click", () => {
      taps += 1;
      document.getElementById("out").textContent = "Tapped " + taps + (taps === 1 ? " time" : " times");
    });
  </script>
</body>
</html>
